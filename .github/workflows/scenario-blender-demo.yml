name: Blender 5 native product demo and independent artifact QA

on:
  push:
    branches:
      - feature/scenario-blender-mcp-pilot-20261016
    paths:
      - "skills/scenario-blender-mcp/**"
      - ".github/workflows/scenario-blender-demo.yml"
  pull_request:
    paths:
      - "skills/scenario-blender-mcp/**"
      - ".github/workflows/scenario-blender-demo.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official Blender 5.0.1 and validate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz" -o blender.tar.xz
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  blender.tar.xz" | sha256sum -c -
          tar -xf blender.tar.xz
          ./blender-5.0.1-linux-x64/blender --version | tee blender-version.txt
      - name: Four genuine Blender renders in isolated processes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          for aspect in 1x1 4x5 9x16 16x9; do
            echo "Rendering $aspect with Blender-native Cycles"
            ./blender-5.0.1-linux-x64/blender -b -t 2 \
              --python skills/scenario-blender-mcp/examples/aura_01_product_hero.py \
              -- --outdir output --size 768 --format "$aspect" \
              > "output/blender_$aspect.log" 2>&1
            grep "PILOT_OUTPUT_VERIFIED_SOURCE aura_01_$aspect.png" "output/blender_$aspect.log"
          done
          cp blender-version.txt output/
      - name: Decode / verify outputs (first process)
        run: |
          python -m pip install --disable-pip-version-check pillow
          python skills/scenario-blender-mcp/examples/verify_demo.py --root output --size 768 > output/verification_console.json
          test "$(python -c 'import json; print(json.load(open("output/verification_evidence.json"))["verified_pass_count"])')" = "4"
      - uses: actions/upload-artifact@v4
        with:
          name: aura-01-blender5-verified-renders
          path: output/
          retention-days: 14
          if-no-files-found: error

  independent-artifact-check:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aura-01-blender5-verified-renders
          path: artifact/
      - name: Independently decode downloaded artifact and check hashes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path("artifact")
          manifest=json.loads((root/"verification_evidence.json").read_text())
          for rec in manifest["checks"]+[manifest["source"]]:
              digest=hashlib.sha256((root/rec["file"]).read_bytes()).hexdigest()
              assert digest == rec["sha256"], rec["file"]
          assert len(manifest["checks"]) == 4
          print("INDEPENDENT_SHA256_CHECK_PASS")
          PY
          python skills/scenario-blender-mcp/examples/verify_demo.py --root artifact --size 768 > /dev/null
          echo "INDEPENDENT_ARTIFACT_QA_PASS"
