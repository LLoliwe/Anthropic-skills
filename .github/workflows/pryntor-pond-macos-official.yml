name: Pond official macOS release verification (no accounts)
on:
  pull_request:
    paths:
      - '.github/workflows/pryntor-pond-macos-official.yml'
permissions:
  contents: read
jobs:
  official-mac-release:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download pinned v1.0.1 x64 DMG and validate exact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --connect-timeout 20 --max-time 240 \
            'https://github.com/raphaelsalaja/pond/releases/download/v1.0.1/Pond-1.0.1-x64.dmg' \
            -o /tmp/pond-official-v1.0.1-x64.dmg
          printf '%s  %s\n' 'aff6291762b80183330253a0317c1132d930a1c8d8ad86af695746bcbcabe442' '/tmp/pond-official-v1.0.1-x64.dmg' | shasum -a 256 -c -
      - name: Inspect signature and Gatekeeper on clean macOS runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pond-official-mount
          hdiutil attach -readonly -nobrowse -quiet -mountpoint /tmp/pond-official-mount /tmp/pond-official-v1.0.1-x64.dmg
          test -d '/tmp/pond-official-mount/Pond.app'
          codesign --verify --deep --strict --verbose=2 '/tmp/pond-official-mount/Pond.app'
          codesign -dv --verbose=4 '/tmp/pond-official-mount/Pond.app' 2>&1 | grep -E '(Authority=|TeamIdentifier=|Identifier=|Runtime Version=)' | head -20
          spctl --assess --type execute --verbose=4 '/tmp/pond-official-mount/Pond.app'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' '/tmp/pond-official-mount/Pond.app/Contents/Info.plist'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' '/tmp/pond-official-mount/Pond.app/Contents/Info.plist'
      - name: Test anonymous local MCP initialize in disposable HOME
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, select, subprocess, tempfile, time
          binary='/tmp/pond-official-mount/Pond.app/Contents/MacOS/Pond'
          with tempfile.TemporaryDirectory() as home:
              env={k:v for k,v in os.environ.items() if k not in ('GITHUB_TOKEN','GH_TOKEN','OPENAI_API_KEY','ANTHROPIC_API_KEY','NPM_TOKEN','AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY')}
              env['HOME']=home
              env['POND_TEST_PUBLIC_ONLY']='1'
              env['POND_SANDBOX']='1'
              stderr_path=os.path.join(home,'startup-stderr.log')
              stderr_sink=open(stderr_path,'wb')
              proc=subprocess.Popen([binary,'--mcp'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=stderr_sink,env=env,start_new_session=True)
              try:
                  request={"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"pryntor-disposable-ci","version":"0.1"}}}
                  proc.stdin.write((json.dumps(request)+'\n').encode()); proc.stdin.flush()
                  start=time.monotonic()
                  observed=[]
                  while time.monotonic()-start < 35:
                      readable,_,_=select.select([proc.stdout],[],[],2.0)
                      if not readable:
                          if proc.poll() is not None: break
                          continue
                      line=proc.stdout.readline()
                      if not line: break
                      try: msg=json.loads(line)
                      except (UnicodeError,ValueError): continue
                      observed.append({"id":msg.get("id"),"hasResult":bool(msg.get("result")),"hasError":bool(msg.get("error"))})
                      if msg.get('id')==1:
                          if msg.get('error'): raise RuntimeError("MCP initialize returned error")
                          server=msg.get('result',{}).get('serverInfo',{})
                          assert server.get('name'), "Missing MCP serverInfo"
                          print('MCP initialize PASS', json.dumps({"server":server,"result":"PASS"}))
                          break
                  else:
                      print("MCP subprocess status", proc.poll(), "observed", repr(observed))
                      stderr_sink.flush()
                      stderr_sink.close()
                      try:
                          from pathlib import Path
                          brief=Path(stderr_path).read_text(errors='replace')
                          print("MCP startup stderr (last 1500 chars)",brief[-1500:])
                          for log_path in Path(home).rglob("*.log"):
                              if log_path == Path(stderr_path): continue
                              print("Disposable log",log_path.name,log_path.read_text(errors='replace')[-1000:])
                      except OSError as exc: print("Cannot access startup logs",str(exc))
                      raise TimeoutError("MCP initialize produced no usable response within 35s")
                  if not observed or observed[-1]["id"]!=1:
                      raise RuntimeError("MCP initialize not confirmed: "+repr(observed))
              finally:
                  proc.kill()
                  try: proc.wait(timeout=5)
                  except subprocess.TimeoutExpired: pass
          PY
      - name: Detach temporary dmg
        if: always()
        shell: bash
        run: hdiutil detach /tmp/pond-official-mount -quiet || true
