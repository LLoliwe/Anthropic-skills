name: Pryntor R0 actual QA workcell

on:
  pull_request:
    paths:
      - "tools/pryntor-improvement-loop/**"
      - ".github/workflows/pryntor-workcell-qa.yml"

permissions:
  contents: read

concurrency:
  group: pryntor-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Checkout review branch with no retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Execute fixed PRY-309 QA workcell and write real receipts
        run: |
          python3 tools/pryntor-improvement-loop/workcell_execute.py \
            --root . --out "$RUNNER_TEMP/pryntor-qa"
      - name: Summarize truthful status
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pryntor-qa/summary.md" ]; then
            cat "$RUNNER_TEMP/pryntor-qa/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "HOLD: no workcell evidence produced" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve immutable QA receipt and exact test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pryntor-qa-workcell-receipt
          path: ${{ runner.temp }}/pryntor-qa/
          retention-days: 7
          if-no-files-found: warn
