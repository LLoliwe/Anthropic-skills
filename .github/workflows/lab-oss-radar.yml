name: Lab automation OSS radar (GitHub public metadata only)

on:
  pull_request:
    paths:
      - 'research/labautomation/**'
      - '.github/workflows/lab-oss-radar.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # Weekly Monday ~08:17 South Africa time; GitHub can delay.

permissions:
  contents: read

concurrency:
  group: lab-oss-radar-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test offline without forum access or external dependencies
        run: |
          python3 -m py_compile research/labautomation/public_forum.py research/labautomation/github_oss_radar.py
          python3 -m unittest discover -v -s research/labautomation -p 'test_*.py'
  snapshot:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch ten allowlisted OSS GitHub repository metadata records
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/lab-oss
          python3 research/labautomation/github_oss_radar.py > evidence/lab-oss/github-oss-snapshot.json
          python3 - <<'PY'
          import json
          with open('evidence/lab-oss/github-oss-snapshot.json', encoding='utf-8') as file:
              report=json.load(file)
          assert report['scope']=='allowlisted-metadata-only'
          assert report['count']==10 and report['failed']==0
          assert all(x['license_certified'] is False for x in report['repositories'])
          PY
      - name: Save short-lived evidence snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab-oss-github-public-metadata
          path: evidence/lab-oss/github-oss-snapshot.json
          retention-days: 7
          if-no-files-found: error
