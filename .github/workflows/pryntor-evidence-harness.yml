name: Pryntor evidence harness R0

on:
  pull_request:
    paths:
      - 'skills/pryntor-evidence-harness/**'
      - '.github/workflows/pryntor-evidence-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Python version
        run: python3 --version
      - name: Run 13 synthetic policy tests
        working-directory: skills/pryntor-evidence-harness
        run: python3 -B -m unittest discover -s tests -v
      - name: Prove agent claim cannot override deliberate failure
        working-directory: skills/pryntor-evidence-harness
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          cmd = [sys.executable, '-B', 'harness.py', 'run', '--project', 'fixture', '--contract', 'contract.json', '--evidence', '/tmp/pryntor-harness-proof.json', '--claim', 'Agent claims success']
          result = subprocess.run(cmd, capture_output=True, text=True, timeout=30)
          assert result.returncode == 2, (result.returncode, result.stderr, result.stdout)
          decision = json.loads(result.stdout)
          assert decision['decision'] == 'hold'
          assert decision['requirements']['R1_title_search']['status'] == 'passed'
          assert decision['requirements']['R2_description_search']['status'] == 'failed'
          assert decision['release_authorized'] is False
          print('Expected HOLD independently verified')
          PY
