name: LVL7 HTTPS runtime & JavaScript-disabled regression
on:
  pull_request:
    paths:
      - "examples/lvl7-r4-https-live/**"
      - ".github/workflows/lvl7-https-runtime.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/test" --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/test/node_modules/.bin/playwright" install --with-deps chromium
      - name: Reproduce frozen iPhone viewer and test active HTTPS-target app
        run: NODE_PATH="$RUNNER_TEMP/test/node_modules" node examples/lvl7-r4-https-live/tests/runtime.cjs