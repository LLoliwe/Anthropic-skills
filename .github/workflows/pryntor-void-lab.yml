name: Pryntor Void lab (no deploy)
on:
  pull_request:
    paths:
      - 'skills/pryntor-void/**'
      - '.github/workflows/pryntor-void-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  built-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skills/pryntor-void/examples/hello
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enforce Node baseline
        run: node -e 'const [major,minor]=process.versions.node.split(".").map(Number);if(major!==24||minor<21)process.exit(1)'
      - name: Static security policy preflight
        run: PRYNTOR_BOOTSTRAP_LOCK=1 npm run policy
      - name: Deterministic install (one-time lock bootstrap permitted)
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
            echo "PRYNTOR_LOCKFILE_START"
            cat package-lock.json
            echo "PRYNTOR_LOCKFILE_END"
          fi
      - name: Dependency vulnerability report
        shell: bash
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const a=require("./audit-report.json");console.log("AUDIT_COUNTS="+JSON.stringify(a.metadata?.vulnerabilities||{}))'
      - name: Real SSR + client production build
        run: npm run build
      - name: Local development HTTP smoke
        run: npm run smoke
      - name: BUILT Node server HTTP, asset and security smoke
        run: npm run smoke:prod
      - name: Verify installed direct dependencies
        run: npm ls --depth=0
      - name: Static security policy postcheck
        run: PRYNTOR_BOOTSTRAP_LOCK=1 npm run policy
      - name: Upload compiled and dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pryntor-void-node-runtime-evidence
          path: |
            skills/pryntor-void/examples/hello/dist/
            skills/pryntor-void/examples/hello/audit-report.json
          if-no-files-found: warn
          retention-days: 7
