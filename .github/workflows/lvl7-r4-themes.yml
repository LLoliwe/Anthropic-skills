name: LVL7 R4 real SVGs and switchable themes
on:
  pull_request:
    paths:
      - "examples/lvl7-r4-themes/**"
      - ".github/workflows/lvl7-r4-themes.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-browser-interactions:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original source
        run: |
          node --check examples/lvl7-r4-themes/tests/browser.cjs
          test -s examples/lvl7-r4-themes/index.html
      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/lvl7-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/lvl7-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test seven real browser layouts, physics and UI
        run: NODE_PATH="$RUNNER_TEMP/lvl7-browser/node_modules" node examples/lvl7-r4-themes/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: lvl7-r4-chromium-evidence
          path: examples/lvl7-r4-themes/screenshots/*.png
          retention-days: 14
          if-no-files-found: error