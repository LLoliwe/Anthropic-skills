name: Pryntor REA — isolated MCP contract probe

on:
  pull_request:
    paths:
      - "skills/pryntor-rea-company/**"
      - "scripts/rea_mcp_probe.py"
      - "fixtures/rea-owned-js/**"
      - ".github/workflows/pryntor-rea-mcp-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-stdio:
    name: Real REA MCP initialize + tools/list (not production approval)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check Node and local preflight without external code
        run: |
          node --version
          python3 -m py_compile scripts/rea_mcp_probe.py
          python3 scripts/rea_mcp_probe.py --self-test
      - name: Exact-version real REA MCP handshake and tool enumeration
        run: |
          python3 scripts/rea_mcp_probe.py -- npx -y rea-agents@6.5.0 mcp
      - name: Original JavaScript fixture oracle and complete REA Evidence
        run: |
          node -e "const app = require('./fixtures/rea-owned-js'); if (app.status() !== 'REA-ok') process.exit(1); console.log('Fixture oracle PASS')"
          sha256sum fixtures/rea-owned-js/*.js
          command -v ps
          npx -y rea-agents@6.5.0 analyze-javascript-application "$PWD/fixtures/rea-owned-js" --json > "$RUNNER_TEMP/rea-owned-fixture-evidence.json"
          python3 - "$RUNNER_TEMP/rea-owned-fixture-evidence.json" <<'PY'
          import json, pathlib, sys
          target = pathlib.Path(sys.argv[1])
          record = json.loads(target.read_text())
          if not isinstance(record, dict) or not record.get("operation") or not isinstance(record.get("normalized_result"), dict):
              raise SystemExit("FAIL: no complete REA evidence envelope/normalized_result")
          graph = record["normalized_result"].get("graph") or record["normalized_result"].get("semantic_graph")
          if not isinstance(graph, dict) or not graph.get("nodes"):
              raise SystemExit("FAIL: no application graph nodes")
          print(json.dumps({"status": "real-rea-static-js-analysis-passed", "operation": record["operation"], "node_count": len(graph["nodes"]), "evidence_bytes": target.stat().st_size}))
          PY
      - name: Retain original test-only analysis evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rea-original-js-analysis-evidence
          path: ${{ runner.temp }}/rea-owned-fixture-evidence.json
          retention-days: 7
          if-no-files-found: error
      - name: Mark limited scope
        if: always()
        run: |
          echo "MCP tool enumeration alone does not establish binary analysis, device control or production readiness."
